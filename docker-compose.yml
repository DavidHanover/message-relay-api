x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://messaging:messaging@db:5432/messaging
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-sendgrid}
  SMS_PROVIDER: ${SMS_PROVIDER:-twilio}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-notifications@company.com}
  DEFAULT_SMS_FROM: ${DEFAULT_SMS_FROM:-+15550000000}
  MOCK_VENDORS: "true"
  MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0.0}
  MAX_ATTEMPTS: ${MAX_ATTEMPTS:-5}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: messaging
      POSTGRES_PASSWORD: messaging
      POSTGRES_DB: messaging
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messaging -d messaging"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
